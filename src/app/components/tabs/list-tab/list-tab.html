<h1>{{ tab.heading }}</h1>
<p>{{ tab.description }}</p>

<mat-list>
  @for (listItem of tab.lists; track $index) {
    <mat-list-item>
      <h3 matListItemTitle>{{ listItem.title }}</h3>
      @for (line of listItem.lines; track $index) {
        <span matListItemLine>{{ line }}</span>
      }
    </mat-list-item>
  }
</mat-list>
