<mat-tab-group [(selectedIndex)]="tabIndex">
  @for (tab of dataService.tabs; track $index) {
    <mat-tab [label]="tab.heading">
      <div class="tab-content">
        @if (tab.type === 'card') {
          <app-card-tab class="tab" [tab]="tab"></app-card-tab>
        }
        @if (tab.type === 'paragraph') {
          <app-paragraph-tab class="tab" [tab]="tab"></app-paragraph-tab>
        }
        @if (tab.type === 'list') {
          <app-list-tab class="tab" [tab]="tab"></app-list-tab>
        }
      </div>
    </mat-tab>
  }
</mat-tab-group>

<router-outlet></router-outlet>

<app-footer></app-footer>
