<h1>{{ dataService.portfolio.heading }}</h1>

@for (card of dataService.portfolio.cards; track $index) {
  <mat-card class="app-card">
    <mat-card-header>
      <div mat-card-avatar>
        <img mat-card-image [src]="card.imageSrc" role="presentation" alt="">
      </div>
      <mat-card-title>{{ card.title }}</mat-card-title>
      <mat-card-subtitle>{{ card.subtitle }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @for (paragraph of card.paragraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    </mat-card-content>
  </mat-card>
}
